packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@nestjs/testing@12.1.2"

onlyBuiltDependencies:
  - "@prisma/engines"
  - "bcrypt"
  - "esbuild"
  - "prisma"
  - "unrs-resolver"
  - "@img/sharp-win32-x64"
  - "@next/swc-win32-x64-msvc"
  - "@rolldown/binding-win32-x64-msvc"
  - "@typescript/typescript-win32-x64"
