name: JobSetu 30-Minute Sarkari Sync Cron

on:
  schedule:
    # Runs every 30 minutes (at minute 0 and 30)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-updates:
    name: Ingest Latest Sarkari Updates
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Cron Endpoint (GET)
        run: |
          echo "Executing JobSetu 30-minute sync cycle..."
          SITE_URL="${{ secrets.PORTAL_CRON_URL }}"
          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://job-setu.vercel.app/api/cron"
          fi
          echo "Hitting: $SITE_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$SITE_URL" \
            -H "x-vercel-cron: 1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Sync successful"
          else
            echo "⚠️ Sync returned status $STATUS (non-fatal)"
          fi
